name: Format Pint.ar storefront repair once

on:
  push:
    branches:
      - feat/2026-storefront-maturity
    paths:
      - ".github/workflows/storefront-format-repair-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out maturity branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/2026-storefront-maturity

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.26.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Apply locked Prettier
        working-directory: modern
        run: |
          pnpm install --frozen-lockfile
          pnpm format

      - name: Commit canonical formatting and retrigger qualification
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# qualification retrigger after canonical formatting\n' >> .github/workflows/storefront-container-qualification-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern/src/domain/product.test.ts .github/workflows/storefront-container-qualification-once.yml
          git commit -m "style: apply canonical storefront test formatting"
          git push origin HEAD:feat/2026-storefront-maturity
