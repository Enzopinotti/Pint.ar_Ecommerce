name: Apply Pint.ar storefront maturity once

on:
  push:
    branches:
      - feat/2026-storefront-maturity
    paths:
      - ".github/workflows/storefront-maturity-once.yml"
      - "modern/pnpm-workspace.yaml"

permissions:
  contents: write

jobs:
  mature:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out maturity branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/2026-storefront-maturity

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.26.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Create Sass and Docker authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modern/src/styles
          git mv modern/src/styles.css modern/src/styles/_legacy-bridge.scss

          python3 <<'PY'
          import json
          from pathlib import Path

          package_path = Path('modern/package.json')
          package = json.loads(package_path.read_text())
          package['devDependencies']['sass'] = '1.104.1'
          package['scripts']['format'] = 'prettier --write "src/**/*.{ts,tsx,css,scss}" index.html package.json tsconfig.json vite.config.ts eslint.config.js README.md'
          package['scripts']['format:check'] = 'prettier --check "src/**/*.{ts,tsx,css,scss}" index.html package.json tsconfig.json vite.config.ts eslint.config.js README.md'
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')

          main_path = Path('modern/src/main.tsx')
          main = main_path.read_text().replace('import "./styles.css";', 'import "./styles/main.scss";')
          main_path.write_text(main)
          PY

          cat > modern/src/styles/_tokens.scss <<'SCSS'
          :root {
            color-scheme: light;
            --store-bg: #f3f0e8;
            --store-surface: #fffdf8;
            --store-surface-soft: #e8e5dc;
            --store-text: #172019;
            --store-text-muted: #617064;
            --store-border: #d8d6ca;
            --store-action: #315d42;
            --store-action-strong: #1f4430;
            --store-accent: #dce9a9;
            --store-warm: #e9874a;
            --store-focus: #d8702f;
            --store-danger: #9b302c;
            --store-success: #2f6a45;
            --store-shadow: 0 18px 50px rgb(33 49 38 / 10%);
            --store-radius-sm: 12px;
            --store-radius-md: 18px;
            --store-radius-lg: 26px;
            --store-space-1: 0.5rem;
            --store-space-2: 0.75rem;
            --store-space-3: 1rem;
            --store-space-4: 1.5rem;
            --store-space-5: 2rem;

            /* Compatibility aliases while historical 2026 selectors migrate. */
            --ink: var(--store-text);
            --muted: var(--store-text-muted);
            --paper: var(--store-surface);
            --line: var(--store-border);
            --green: var(--store-action);
            --green-dark: var(--store-action-strong);
            --lime: var(--store-accent);
            --orange: var(--store-warm);
            --danger: var(--store-danger);
            --shadow: var(--store-shadow);

            color: var(--store-text);
            background: var(--store-bg);
            accent-color: var(--store-action);
          }
          SCSS

          cat > modern/src/styles/_mixins.scss <<'SCSS'
          @mixin surface-card($padding: 1.5rem) {
            padding: $padding;
            border: 1px solid var(--store-border);
            border-radius: var(--store-radius-lg);
            background: var(--store-surface);
            box-shadow: 0 8px 24px rgb(33 49 38 / 6%);
          }

          @mixin control {
            min-width: 0;
            min-height: 44px;
            border: 1px solid var(--store-border);
            border-radius: var(--store-radius-sm);
            background: var(--store-surface);
            color: var(--store-text);
            padding: 0.75rem 0.8rem;
          }
          SCSS

          cat > modern/src/styles/_storefront.scss <<'SCSS'
          @use "./mixins" as mixins;

          .storefront-controls {
            grid-template-columns: minmax(220px, 1.4fr) minmax(180px, 0.8fr);
            align-items: end;
          }

          .catalog-control {
            display: grid;
            gap: 0.45rem;
            min-width: 0;
            font-weight: 750;
          }

          .catalog-control input,
          .catalog-control select {
            @include mixins.control;
          }

          .stock-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            min-height: 44px;
            width: fit-content;
            font-weight: 750;
            cursor: pointer;
          }

          .stock-toggle input {
            width: 1.1rem;
            height: 1.1rem;
            margin: 0;
          }

          .storefront-controls .category-links {
            grid-column: 1 / -1;
          }

          .product-card {
            transition:
              transform 160ms ease,
              box-shadow 160ms ease;
          }

          .product-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--store-shadow);
          }

          .state-card .button {
            margin-top: var(--store-space-2);
          }

          @media (max-width: 720px) {
            .storefront-controls {
              grid-template-columns: minmax(0, 1fr);
            }

            .storefront-controls .category-links {
              grid-column: auto;
            }

            .stock-toggle {
              width: 100%;
            }
          }
          SCSS

          cat > modern/src/styles/_accessibility.scss <<'SCSS'
          button:focus-visible,
          a:focus-visible,
          input:focus-visible,
          select:focus-visible {
            outline: 3px solid var(--store-focus);
            outline-offset: 3px;
          }

          @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
              scroll-behavior: auto !important;
              transition-duration: 0.01ms !important;
              animation-duration: 0.01ms !important;
              animation-iteration-count: 1 !important;
            }
          }

          @media (forced-colors: active) {
            .button,
            .product-card,
            .trust-card,
            .order-summary,
            .catalog-controls {
              forced-color-adjust: auto;
            }
          }
          SCSS

          cat > modern/src/styles/main.scss <<'SCSS'
          /*
           * The original 2026 CSS is preserved as a migration bridge.
           * Runtime semantic custom properties below are the visual authority;
           * Sass owns composition, reuse and responsive structure.
           */
          @use "./legacy-bridge";
          @use "./tokens";
          @use "./storefront";
          @use "./accessibility";
          SCSS

          cat > modern/.dockerignore <<'EOF'
          node_modules
          dist
          coverage
          .git
          .env
          .env.*
          !.env.example
          *.log
          EOF

          cat > modern/Dockerfile <<'EOF'
          # syntax=docker/dockerfile:1.7
          FROM node:24.21.0-alpine3.24 AS build
          WORKDIR /app
          RUN npm install --global pnpm@11.26.0
          COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
          RUN pnpm install --frozen-lockfile
          COPY . .
          RUN pnpm build

          FROM nginx:1.31.5-alpine3.24 AS runtime
          COPY nginx.conf /etc/nginx/nginx.conf
          COPY --from=build --chown=nginx:nginx /app/dist /usr/share/nginx/html
          USER nginx
          EXPOSE 8080
          HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 CMD wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1
          ENTRYPOINT ["nginx", "-g", "daemon off;"]
          EOF

          cat > modern/nginx.conf <<'EOF'
          worker_processes auto;
          pid /tmp/nginx.pid;
          error_log /dev/stderr warn;

          events {
            worker_connections 1024;
          }

          http {
            include /etc/nginx/mime.types;
            default_type application/octet-stream;
            access_log /dev/stdout;
            sendfile on;
            gzip on;
            gzip_types text/css application/javascript application/json image/svg+xml;

            client_body_temp_path /tmp/client_temp;
            proxy_temp_path /tmp/proxy_temp;
            fastcgi_temp_path /tmp/fastcgi_temp;
            uwsgi_temp_path /tmp/uwsgi_temp;
            scgi_temp_path /tmp/scgi_temp;

            server {
              listen 8080;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;

              add_header X-Content-Type-Options "nosniff" always;
              add_header X-Frame-Options "DENY" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
              add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;

              location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
              }

              location /assets/ {
                try_files $uri =404;
                expires 7d;
                add_header Cache-Control "public, max-age=604800, immutable";
              }

              location / {
                try_files $uri $uri/ /index.html;
              }
            }
          }
          EOF

          cat > modern/compose.yaml <<'EOF'
          services:
            storefront:
              build:
                context: .
                dockerfile: Dockerfile
              ports:
                - "8080:8080"
              read_only: true
              tmpfs:
                - /tmp:size=16m,mode=1777
              cap_drop:
                - ALL
              security_opt:
                - no-new-privileges:true
              restart: unless-stopped
          EOF

          cat > docs/storefront-maturity-2026.md <<'EOF'
          # Pint.ar storefront maturity — 2026

          ## Role in the portfolio

          Pint.ar is the storefront/product-engineering ecommerce showcase. The historical 2023 CRA/Firebase application remains preserved as evidence; the maintained authority is `modern/`.

          Meow Matrix is tracked separately as the future full-stack ecommerce showcase. Pint.ar therefore does not invent a backend, authentication or payments only to increase technology count.

          ## Frontend authority

          The maintained storefront uses React, TypeScript, Vite and Sass. Sass owns composition, mixins and responsive organization, while semantic CSS custom properties own runtime visual meaning. The original first-pass CSS is retained temporarily as `_legacy-bridge.scss` so the migration stays reviewable instead of becoming a visual rewrite.

          ## Container authority

          `modern/Dockerfile` builds with Node 24 and serves the static artifact from Nginx as the unprivileged `nginx` user on port 8080. The Nginx contract includes SPA fallback, `/healthz`, restrictive browser headers and cache handling for immutable assets.

          `modern/compose.yaml` additionally runs read-only, drops Linux capabilities, enables `no-new-privileges` and provides only `/tmp` as writable memory-backed storage.

          ## Product maturity in this phase

          Catalogue selection now combines free-text search, route category filters, an in-stock-only toggle and deterministic sorting. Product data remains explicit demo fixture data; no UI copy should imply current commercial inventory, payment, email or stock reservation.

          ## Dependency build policy

          pnpm 11 keeps `strictDepBuilds` enabled. Sass currently resolves the optional native filesystem watcher `@parcel/watcher`; Pint.ar explicitly denies its lifecycle build because CI and production compile Sass without watch mode. Any future package with an unreviewed build script must fail install until reviewed.

          ## Next qualification

          This phase is not complete until frozen install, formatting, lint, strict TypeScript, tests, production build, Docker build, container health/deep-route smoke and real-browser responsive smoke all pass.
          EOF

      - name: Refresh lockfile
        working-directory: modern
        run: pnpm install --lockfile-only

      - name: Install frozen graph and format
        working-directory: modern
        run: |
          pnpm install --frozen-lockfile
          pnpm format

      - name: Commit maturity block
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern docs
          git commit -m "feat: add Sass and Docker storefront maturity"
          git push origin HEAD:feat/2026-storefront-maturity

      - name: Run maintained quality contract
        working-directory: modern
        run: pnpm check

      - name: Build production container
        working-directory: modern
        run: docker build --pull -t pintar-storefront:qualification .

      - name: Smoke production container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name pintar-storefront-smoke \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 8080:8080 \
            pintar-storefront:qualification
          trap 'docker stop pintar-storefront-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = "ok"
          for path in / /carrito /checkout /sobreNosotros /Item/latex-interior-blanco; do
            code="$(curl -sS -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:8080${path}")"
            test "$code" = "200"
            grep -Fq '<title>Pint.ar — Ecommerce educativo 2026</title>' /tmp/page.html
          done
          headers="$(curl -sSI http://127.0.0.1:8080/)"
          grep -qi '^X-Content-Type-Options: nosniff' <<<"$headers"
          grep -qi '^X-Frame-Options: DENY' <<<"$headers"
          grep -qi '^Content-Security-Policy:' <<<"$headers"
          docker inspect --format '{{.Config.User}}' pintar-storefront-smoke | grep -Fx 'nginx'
          echo "Pint.ar Docker storefront smoke passed."
