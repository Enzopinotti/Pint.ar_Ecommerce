name: Modern Pint.ar quality

on:
  pull_request:
    paths:
      - "modern/**"
      - "docs/**"
      - ".nvmrc"
      - ".editorconfig"
      - "README.md"
      - ".github/workflows/modern-quality.yml"
  push:
    branches:
      - main
    paths:
      - "modern/**"
      - "docs/**"
      - ".nvmrc"
      - ".editorconfig"
      - "README.md"
      - ".github/workflows/modern-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: modern

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.26.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run maintained quality contract
        run: pnpm check

      - name: Verify maintained artifact budget
        shell: bash
        run: |
          set -euo pipefail
          size_kb="$(du -sk dist | cut -f1)"
          echo "maintained dist size: ${size_kb} KiB"
          test "$size_kb" -lt 2048

          if find dist -type f \( -iname '*.zip' -o -iname '*.gif' -o -iname '*.psd' \) -print -quit | grep -q .; then
            echo "Historical heavyweight source artifact leaked into maintained delivery."
            exit 1
          fi

  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: modern

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build production image
        run: docker build --pull -t pintar-storefront:ci .

      - name: Run hardened container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name pintar-storefront-ci \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 8080:8080 \
            pintar-storefront:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then exit 0; fi
            sleep 1
          done

          docker logs pintar-storefront-ci
          exit 1

      - name: Verify runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = "ok"
          test "$(docker inspect --format '{{.Config.User}}' pintar-storefront-ci)" = "nginx"

          for path in / /carrito /checkout /sobreNosotros /Item/latex-interior-blanco /category/Pintura; do
            code="$(curl -sS -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:8080${path}")"
            echo "$path -> HTTP $code"
            test "$code" = "200"
            grep -Fq '<title>Pint.ar — Ecommerce educativo 2026</title>' /tmp/page.html
          done

          headers="$(curl -sSI http://127.0.0.1:8080/)"
          grep -qi '^X-Content-Type-Options: nosniff' <<<"$headers"
          grep -qi '^X-Frame-Options: DENY' <<<"$headers"
          grep -qi '^Referrer-Policy: strict-origin-when-cross-origin' <<<"$headers"
          grep -qi '^Permissions-Policy:' <<<"$headers"
          grep -qi '^Content-Security-Policy:' <<<"$headers"

      - name: Stop container
        if: always()
        run: docker stop pintar-storefront-ci >/dev/null 2>&1 || true
