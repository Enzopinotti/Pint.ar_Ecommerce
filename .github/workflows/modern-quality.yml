name: Modern Pint.ar quality

on:
  pull_request:
    paths:
      - "modern/**"
      - "docs/**"
      - ".nvmrc"
      - ".editorconfig"
      - "README.md"
      - ".github/workflows/modern-quality.yml"
  push:
    branches:
      - main
    paths:
      - "modern/**"
      - "docs/**"
      - ".nvmrc"
      - ".editorconfig"
      - "README.md"
      - ".github/workflows/modern-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: modern

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.26.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run maintained quality contract
        run: pnpm check

      - name: Verify maintained artifact budget
        shell: bash
        run: |
          set -euo pipefail
          size_kb="$(du -sk dist | cut -f1)"
          echo "maintained dist size: ${size_kb} KiB"
          test "$size_kb" -lt 2048

          if find dist -type f \( -iname '*.zip' -o -iname '*.gif' -o -iname '*.psd' \) -print -quit | grep -q .; then
            echo "Historical heavyweight source artifact leaked into maintained delivery."
            exit 1
          fi
