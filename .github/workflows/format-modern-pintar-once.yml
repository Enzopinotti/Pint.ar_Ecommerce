name: Format modern Pint.ar once

on:
  push:
    branches:
      - modernization/2026-pintar-v1
    paths:
      - ".github/workflows/format-modern-pintar-once.yml"

permissions:
  contents: write

jobs:
  format-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out modernization branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernization/2026-pintar-v1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.26.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: modern
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier
        working-directory: modern
        run: pnpm format

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: apply canonical Pint.ar formatting"
            git push origin HEAD:modernization/2026-pintar-v1
          fi

      - name: Run full maintained quality contract
        working-directory: modern
        run: pnpm check
