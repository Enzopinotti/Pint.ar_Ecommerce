name: Deploy modern Pint.ar to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "modern/**"
      - "index.html"
      - "404.html"
      - "robots.txt"
      - "sitemap.xml"
      - ".nojekyll"
      - "assets/**"
      - ".nvmrc"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.26.0
          package_json_file: modern/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: modern
        run: pnpm install --frozen-lockfile

      - name: Build Pages artifact
        working-directory: modern
        run: |
          pnpm build:pages
          cp dist/index.html dist/404.html

      - name: Verify Pages artifact contract
        shell: bash
        run: |
          set -euo pipefail
          test -f modern/dist/index.html
          test -f modern/dist/404.html
          test -f modern/dist/robots.txt
          test -f modern/dist/sitemap.xml
          test -f modern/dist/.nojekyll
          grep -Fq '/Pint.ar_Ecommerce/assets/' modern/dist/index.html
          grep -Fq 'https://enzopinotti.github.io/Pint.ar_Ecommerce/' modern/dist/index.html
          grep -Fq 'https://enzopinotti.github.io/Pint.ar_Ecommerce/sitemap.xml' modern/dist/robots.txt
          cmp -s modern/dist/index.html modern/dist/404.html

      - name: Verify branch-source mirror parity
        shell: bash
        run: |
          set -euo pipefail
          cmp modern/dist/index.html index.html
          cmp modern/dist/404.html 404.html
          cmp modern/dist/robots.txt robots.txt
          cmp modern/dist/sitemap.xml sitemap.xml
          cmp modern/dist/.nojekyll .nojekyll
          diff -qr modern/dist/assets assets

      - name: Configure Pages metadata
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: modern/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  public-smoke:
    name: public-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: deploy
    steps:
      - name: Verify public HTTP artifact
        shell: bash
        env:
          ORIGIN: https://enzopinotti.github.io/Pint.ar_Ecommerce
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS "$ORIGIN/" -o /tmp/index.html \
              && grep -Fq '<title>Pint.ar — Ecommerce educativo 2026</title>' /tmp/index.html \
              && grep -Fq 'https://enzopinotti.github.io/Pint.ar_Ecommerce/' /tmp/index.html \
              && grep -Fq '/Pint.ar_Ecommerce/assets/' /tmp/index.html; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"

          asset_path="$(grep -oE '/Pint\.ar_Ecommerce/assets/index-[^\" ]+\.js' /tmp/index.html | head -n1)"
          test -n "$asset_path"
          curl -fsS "https://enzopinotti.github.io${asset_path}" -o /tmp/app.js
          test -s /tmp/app.js

          curl -fsS "$ORIGIN/robots.txt" -o /tmp/robots.txt
          grep -Fq 'Sitemap: https://enzopinotti.github.io/Pint.ar_Ecommerce/sitemap.xml' /tmp/robots.txt

          curl -fsS "$ORIGIN/sitemap.xml" -o /tmp/sitemap.xml
          grep -Fq '<loc>https://enzopinotti.github.io/Pint.ar_Ecommerce/</loc>' /tmp/sitemap.xml

          deep_code="$(curl -sS -o /tmp/deep.html -w '%{http_code}' "$ORIGIN/carrito")"
          case "$deep_code" in
            200|404) ;;
            *) echo "Unexpected deep-route status: $deep_code"; exit 1 ;;
          esac
          grep -Fq '<title>Pint.ar — Ecommerce educativo 2026</title>' /tmp/deep.html

      - name: Verify direct deep route in Chrome
        shell: bash
        env:
          CART_URL: https://enzopinotti.github.io/Pint.ar_Ecommerce/carrito
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          "$chrome" --version
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=5000 \
            --dump-dom \
            "$CART_URL" > /tmp/cart-dom.html
          grep -Fq 'Tu selección' /tmp/cart-dom.html
          grep -Fq 'El carrito está vacío' /tmp/cart-dom.html
          grep -Fq 'Ir al catálogo' /tmp/cart-dom.html
          echo 'Pint.ar public Pages smoke passed.'
